    <linearGradient id="w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef3f7"/><stop offset="1" stop-color="#dfe8ef"/></linearGradient>
    <linearGradient id="u" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e4eaf0"/></linearGradient>
    <linearGradient id="air" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fc3ea" stop-opacity=".75"/><stop offset="1" stop-color="#8fc3ea" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="480" height="360" fill="url(#w)"/>
  <rect y="276" width="480" height="84" fill="#c9d3dc"/>
  <rect y="270" width="480" height="8" fill="#f7f9fb"/>
