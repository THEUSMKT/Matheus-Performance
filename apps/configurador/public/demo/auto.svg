  <path d="M254 212h14" stroke="#1f3f60" stroke-width="5" stroke-linecap="round"/>
  <!-- rodas -->
  <g><circle cx="156" cy="262" r="32" fill="#2b2f36"/><circle cx="156" cy="262" r="14" fill="#aeb6c0"/></g>
  <g><circle cx="352" cy="262" r="32" fill="#2b2f36"/><circle cx="352" cy="262" r="14" fill="#aeb6c0"/></g>
