    <linearGradient id="c" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3e6fa3"/><stop offset="1" stop-color="#2f5d8a"/></linearGradient>
  </defs>
  <rect width="480" height="360" fill="url(#g)"/>
  <!-- porta de garagem -->
  <rect x="40" y="40" width="400" height="200" rx="6" fill="#c7cdd6"/>
